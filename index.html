<body>
    <footer>
        <button onclick="app.openButtons()" class="openButtons" title="Add a module (Space)">
            <span class="openButtonsIcon" aria-hidden="true">+</span> Add module
        </button>
        <connectedUsers></connectedUsers>
        <button type="button" onclick="app.openPerf()" class="openPerf sysStatus" title="Open performance">audio …</button>


        <!-- <button onclick="app.save()">💾 save</button> -->
        <button onclick="app.download()" class="download">Download</button>
        <button onclick="app.saveLocalPatch()" class="saveLocal">Save</button>
        <select id="samplePatchSelect" onchange="app.loadSamplePatch(this.value)">
            <option value="">Load sample…</option>
            <option value="samples/mouse.json">mouse filter</option>
            <option value="samples/elefante.json">elefante</option>
            <option value="samples/fm-bass.json">fm-bass</option>
            <option value="samples/seq-pluck.json">seq-pluck</option>
            <option value="samples/ring-mod.json">ring-mod</option>
            <option value="samples/seq-filter-mod-adsr.json">seq-filter-mod-adsr</option>
            <option value="samples/house-dino.json">house-dino</option>
            <option value="samples/house-dino-mixer.json">house-dino mixer</option>
            <option value="samples/drums.json">drums</option>
            <option value="samples/hammond-rotary.json">hammond-rotary</option>
            <option value="samples/talker.json">talker</option>
            <option value="samples/vowel-xy.json">letras xy</option>
            <option value="samples/shader-lfo.json">shader lfo</option>
            <option value="samples/house_n_noise_mouse.json">noisy house</option>
            <option value="samples/fugue7.json">fugue7 midi</option>
            <option value="samples/seq-switch.json">seq switch</option>
            <option value="samples/seq-demux.json">seq demux</option>
            <option value="samples/analog-808.json">analog 808</option>
            <option value="samples/folded-acid.json">folded acid</option>
            <option value="samples/night-bus.json">night bus</option>
        </select>


        <!-- <button onclick="app.load()">📂 load</button> -->

        <!-- <button onclick="app.loadFromFireStore()">📂 load from firestore</button> -->

        <!-- <button onclick="app.stop()" class="stop"> ■ </button> -->

        <button onclick="app.changeBPM()" id="bpmButton">BPM</button>
        <button onclick="app.openCables()" class="openCables">Cables</button>
        <button onclick="app.undo()" class="undo" disabled>Undo</button>
        <button onclick="app.redo()" class="redo" disabled>Redo</button>
        <button onclick="app.openHistory()" class="openHistory">History</button>
        <button onclick="app.play()" class="play"> ▶ </button>
        <div class="patchName"></div>

    </footer>
    <div class="paletteOverlay" onclick="app.openButtons()"></div>
    <div class="buttons modulePalette" aria-label="Module palette"></div>
    <div class="historyPanel">
        <div class="historyList"></div>
    </div>
    <div class="cablePanel">
        <label>Gravity <span data-val="gravity">4000</span>
            <input type="range" name="gravity" min="0" max="8000" step="50" value="4000">
        </label>
        <label>Stiffness <span data-val="stiffness">0</span>
            <input type="range" name="stiffness" min="0" max="2400" step="10" value="0">
        </label>
        <label>Damping <span data-val="damping">0.88</span>
            <input type="range" name="damping" min="0" max="1" step="0.01" value="0.88">
        </label>
        <label>Slack <span data-val="slack">0.5</span>
            <input type="range" name="slack" min="0" max="4" step="0.01" value="0.5">
        </label>
        <label>Bead radius <span data-val="beadRadius">1.25</span>
            <input type="range" name="beadRadius" min="0" max="16" step="0.05" value="1.25">
        </label>
        <label>Alpha <span data-val="cableAlpha">0.5</span>
            <input type="range" name="cableAlpha" min="0" max="1" step="0.01" value="0.5">
        </label>
    </div>
    <div class="perfPanel">
        <div class="perfHead">Performance</div>
        <div class="perfSummary"></div>
        <div class="perfList"></div>
    </div>
    <app></app>
    <script>
        var app = new App(document.querySelector('app'))
    </script>
