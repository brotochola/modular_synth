    <footer>
        <button onclick="app.openButtons()" class="openButtons">+ Modules</button>
        <connectedUsers></connectedUsers>


        <!-- <button onclick="app.save()">💾 save</button> -->
        <button onclick="app.download()" class="download">💾 Download Patch</button>
        <select id="samplePatchSelect" onchange="app.loadSamplePatch(this.value)">
            <option value="">Load sample…</option>
            <option value="samples/mouse.json">mouse filter</option>
            <option value="samples/elefante.json">elefante</option>
            <option value="samples/fm-bass.json">fm-bass</option>

        </select>

        <button onclick="app.openCables()" class="openCables">Cables</button>
        <button onclick="app.undo()" class="undo" disabled>Undo</button>
        <button onclick="app.redo()" class="redo" disabled>Redo</button>
        <button onclick="app.openHistory()" class="openHistory">History</button>
        <button onclick="app.play()" class="play"> ▶ </button>
        <div class="patchName"></div>

    </footer>
    <div class="buttons">

        <span class="categoryOfComponent">
            <button onclick="app.addOscillator()">🚴🏿 Oscillator</button>
            <!-- <button onclick="app.addWaveShaper()"> add wave shaper</button> -->

            <button onclick="app.addAudioPlayer()">🎶 Audio Player</button>

    <div class="historyPanel">
        <div class="historyList"></div>
    </div>
    <div class="cablePanel">
        <label>Gravity <span data-val="gravity">4000</span>
            <input type="range" name="gravity" min="0" max="8000" step="50" value="4000">
        </label>
        <label>Stiffness <span data-val="stiffness">0</span>
            <input type="range" name="stiffness" min="0" max="2400" step="10" value="0">
        </label>
        <label>Damping <span data-val="damping">0.88</span>
            <input type="range" name="damping" min="0" max="1" step="0.01" value="0.88">
        </label>
        <label>Slack <span data-val="slack">0.5</span>
            <input type="range" name="slack" min="0" max="4" step="0.01" value="0.5">
        </label>
        <label>Bead radius <span data-val="beadRadius">1.25</span>
            <input type="range" name="beadRadius" min="0" max="16" step="0.05" value="1.25">
        </label>
        <label>Alpha <span data-val="cableAlpha">0.5</span>
            <input type="range" name="cableAlpha" min="0" max="1" step="0.01" value="0.5">
        </label>
    </div>

        var app = new App(document.querySelector('app'))
