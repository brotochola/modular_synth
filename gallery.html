  <link rel="stylesheet" href="styles.css">
  <style>
    body.gallery-mode {
      overflow: auto !important;
      background: #0a0e0c;
    }
    body.gallery-mode app {
      position: relative !important;
      width: 100% !important;
      height: auto !important;
      min-height: 100vh;
      background: #121816 !important;
      overflow: visible !important;
    }
    body.gallery-mode app .mainContainer {
      position: relative !important;
      width: 100% !important;
      height: auto !important;
      top: 0 !important;
      left: 0 !important;
      transform: none !important;
      filter: none !important;
    }
    body.gallery-mode .linesCanvas,
    body.gallery-mode footer,
    body.gallery-mode .buttons,
    body.gallery-mode .historyPanel,
    body.gallery-mode .cablePanel,
    body.gallery-mode .perfPanel,
    body.gallery-mode .openButtons {
      display: none !important;
    }
    body.gallery-mode component {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      margin: 16px 24px;
      display: flex;
    }
    body.gallery-mode .gallery-label {
      font-family: "IBM Plex Mono", monospace;
      color: #5dffc2;
      font-size: 12px;
      margin: 24px 24px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    body.gallery-mode #gallery-root {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-bottom: 80px;
    }
  </style>

<body class="gallery-mode">
  <footer style="display:none">
    <span class="patchName"></span>
    <button class="play"></button>
    <button class="undo"></button>
    <button class="redo"></button>
    <button id="bpmButton"></button>
  </footer>
  <div class="buttons" style="display:none"></div>
  <div class="historyPanel" style="display:none"><div class="historyList"></div></div>
  <div class="cablePanel" style="display:none"></div>
  <connectedUsers style="display:none"></connectedUsers>
  <div id="gallery-root"></div>
  <app></app>
  <script>
    (async function () {
      var appEl = document.querySelector("app");
      var app = new App(appEl);
      window.app = app;
      try {
        await Promise.race([
          app.actx.resume(),
          new Promise(function (r) {
            setTimeout(r, 500);
          }),
        ]);
      } catch (e) {}

      var skip = new Set(["Gain", "Output"]);
      var names = Object.keys(App.COMPONENT_CLASSES).filter(function (n) {
        return !skip.has(n);
      });

      var root = document.getElementById("gallery-root");

      for (var i = 0; i < names.length; i++) {
        var name = names[i];
        var Ctor = App.COMPONENT_CLASSES[name];
        var label = document.createElement("div");
        label.className = "gallery-label";
        label.textContent = Ctor.name || name;
        root.appendChild(label);

        var wrap = document.createElement("div");
        wrap.style.display = "inline-block";
        root.appendChild(wrap);

        try {
          var c = new Ctor(app);
          app.components.push(c);
          c.container.setAttribute("data-module", name);
          wrap.appendChild(c.container);
          c.container.style.left = "0px";
          c.container.style.top = "0px";
          if (name === "MidiFilePlayer") {
            try {
              var res = await fetch("youre only lonely L.mid");
              var buf = await res.arrayBuffer();
              c.loadMidiFromBuffer(buf);
              for (var w = 0; w < 40; w++) {
                if ((c.voices || []).length > 1 && (c.node || {}).numberOfOutputs > 2) {
                  break;
                }
                await new Promise(function (r) {
                  setTimeout(r, 100);
                });
              }
              console.log(
                "gallery MidiFilePlayer voices",
                (c.voices || []).length,
                "outs",
                (c.node || {}).numberOfOutputs,
                "labels",
                c.outputLabels
              );
            } catch (e) {
              console.warn("gallery midi load", e);
            }
          }
        } catch (err) {
          wrap.textContent = "FAILED: " + name + " — " + err.message;
          wrap.style.color = "#ff5a5a";
          console.error(name, err);
        }
      }

      await new Promise(function (r) {
        setTimeout(r, 5000);
      });
      document.documentElement.setAttribute("data-gallery-ready", "1");
    })().catch(function (e) {
      console.error(e);
      document.documentElement.setAttribute("data-gallery-ready", "1");
      document.body.setAttribute("data-gallery-error", String(e && e.message));
    });
  </script>
